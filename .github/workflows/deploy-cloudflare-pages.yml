name: Deploy to Cloudflare Pages

on:
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-tos-hr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy tos-hr
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          project_name="tos-hr"
          production_branch="main"
          projects_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          status="$(
            curl --silent --show-error \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "${projects_url}/${project_name}"
          )"

          if [[ "${status}" == "404" ]]; then
            echo "Cloudflare Pages project ${project_name} does not exist; creating it."
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "{\"name\":\"${project_name}\",\"production_branch\":\"${production_branch}\"}" \
              "${projects_url}"
          elif [[ "${status}" != "200" ]]; then
            echo "Unable to check Cloudflare Pages project ${project_name} (HTTP ${status})."
            cat "${response_file}"
            exit 1
          else
            echo "Cloudflare Pages project ${project_name} already exists."
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=tos-hr --branch=main

      - name: Show deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "Deployed to ${DEPLOYMENT_URL}"
